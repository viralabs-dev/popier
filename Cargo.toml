[package]
name = "popier"
version = "0.3.0"
edition = "2024"
description = "Watch GitHub Actions of many repositories on one screen, down to every step"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viralabs-dev/popier"
readme = "README.md"
keywords = ["github-actions", "ci", "tui", "terminal", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1.1.11"
futures = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
