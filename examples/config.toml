# popier configuration
# Location: ~/.config/popier/config.toml (or pass --config <path>)

[settings]
# Seconds between refreshes. Unchanged data is served via ETag and does not
# count against the GitHub rate limit, but keep this >= 30 anyway.
refresh_secs = 60
# "attention": expand only workflows that are running, queued or failed.
# "all": expand every workflow.
expand = "attention"
# Recent runs scanned per repo to find the latest run of each workflow.
runs_per_repo = 30
# Desktop notification (notify-send on Linux, a toast on Windows) when a workflow starts failing, and a
# quieter one when it passes again. Only in the interactive dashboard.
notify = true
# Restrict notifications to these branches. Empty list = every branch.
notify_branches = []
# Color theme: "noite" (default), "brasa", "papel" (light), "alto-contraste",
# or "terminal" (your terminal's own 16 colors, picked automatically when the
# terminal has no true color). Press `t` in the dashboard to try them.
# A custom theme is ~/.config/popier/themes/<name>.toml with token = "#rrggbb".
# theme = "noite"
# Progress bars: "line" (━━━╸───) or "block" (███▌░░░).
bar = "line"

# One [[repo]] block per repository, in display order.
# Optional keys: label = "short name", branch = "main"

[[repo]]
slug = "your-org/your-repo"

[[repo]]
slug = "your-org/another-repo"
label = "another"
branch = "main"

# A project with several repositories can be a group: one row with the worst
# state of its repos, folded and unfolded like a repo. Slugs listed only here
# are watched with default options. `popier init --discover` writes groups
# for repos that share a name prefix.
# [[group]]
# name = "your-project"
# repos = ["your-org/your-repo", "your-org/your-repo-api"]
