# Demo config: public viralabs-dev repositories with active workflows only.
[settings]
refresh_secs = 30
expand = "attention"
runs_per_repo = 30
notify = false
theme = "noite"
bar = "line"

[[group]]
name = "brabo"
repos = [
    "viralabs-dev/brabo",
    "viralabs-dev/brabo-api",
    "viralabs-dev/brabo-broker",
    "viralabs-dev/brabo-ci",
    "viralabs-dev/brabo-contracts",
    "viralabs-dev/brabo-engine",
    "viralabs-dev/brabo-infra",
    "viralabs-dev/brabo-qa",
    "viralabs-dev/brabo-runner",
    "viralabs-dev/brabo-web",
    "viralabs-dev/brabo-workspace",
]

